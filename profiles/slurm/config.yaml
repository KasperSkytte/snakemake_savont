# Use with: snakemake --workflow-profile slurm --sdm apptainer (or conda)
executor: slurm
# max number of jobs submitted at once, matches 96 barcodes on a nanopore flowcell
jobs: 96
# memory and runtime requests are scaled up with each attempt
retries: 2
rerun-incomplete: true
show-failed-logs: true
latency-wait: 60
