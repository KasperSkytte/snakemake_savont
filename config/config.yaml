# This file is for various variables used throughout the workflow.
# See a description of each setting in the config/README.md file.
input_dir: ".test/nanopore_run_xyz123/fastq_pass"
output_dir: "output"
tmp_dir: "tmp"
log_dir: "logs"
threads: 16
max_mem_mb: 250000
# True: generate ASVs from all samples pooled (savont asv --pooled-samples)
# False: generate ASVs for each sample individually and merge them with savont export
pool_samples: False
# 27F/534R (V1-V3) primers, 534R as its reverse complement
cutadapt_args: "-g AGAGTTTGATCMTGGCTCAG...CCAGCAGCCGCGGTAAT --revcomp --discard-untrimmed -e 0.15 -m 400 -M 600"
min_reads: 100
savont_asv_args: "--min-read-length 400 --max-read-length 600"
# taxonomy using savont classify, a savont database is downloaded if missing
classify_savont: True
savont_db: "databases/silva-138.2"
classify_savont_args: ""
# taxonomy using usearch -sintax, SINTAX formatted fasta (or .udb)
classify_usearch_sintax: True
sintax_db: "databases/MiDAS5.3_20240320/FLASVs_w_sintax.fa"
classify_usearch_sintax_args: "-strand both -sintax_cutoff 0.8"
# taxonomy using savont sintax and savont_db. Genus level only, does not classify to species
classify_savont_sintax: False
classify_savont_sintax_args: ""
# also estimate abundances by mapping reads to the ASVs using usearch -otutab
abund_usearch: True
